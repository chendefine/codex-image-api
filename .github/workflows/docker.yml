name: docker

on:
  push:
    branches: ["**"]
    # Only strict vX.Y.Z release tags; they are the only pushes that build images.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    # Not evaluated for tag pushes.
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1

  # Images are built and pushed only for vX.Y.Z tag pushes; branches, PRs and
  # manual runs only run the tests. codex-update.yml republishes the newest tag
  # when codex releases a new version.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
